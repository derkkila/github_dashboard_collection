# Example GitHub Copilot billing modular input.
#
# This stanza is disabled by default. Copy it, give it a unique <name>, set
# your enterprise slug, and enter your PAT in the "token" field (or set it in
# Settings > Data inputs > GitHub Copilot Billing). On the first run the token
# is encrypted into storage/passwords (realm = <name>) and the field is masked.
# Then enable it. See docs/copilot_billing_collection.MD for full setup.
#
# The PAT requires enterprise admin / billing-manager access and the
# manage_billing:copilot scope. Use a CLASSIC PAT (fine-grained PATs are not
# supported by the billing endpoints).

[github_copilot_billing]
# Scheme-level interpreter selection for the Python modular input.
python.version = python3
python.required = 3.9

[github_copilot_billing://customer-success-architects-ea-sandbox]
enterprise = customer-success-architects-ea-sandbox
# Enter your CLASSIC PAT here (or in the Data inputs UI). It is encrypted into
# storage/passwords and masked on the first run. Do NOT commit a real token.
# token = ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
api_base_url = https://api.github.com
collect_budgets = true
collect_ai_credit = true
collect_by_user = false
# Per cost center: leave cost_center_ids blank to auto-enumerate active centers.
collect_by_cost_center = false
# cost_center_ids = abc123,def456
# Per organization: set collect_by_org and list org logins below.
collect_by_org = false
# organizations = my-org,another-org
# start_date = 2024-06-01
lookback_days = 30
# Run once per day (in seconds). A cron expression is also accepted.
interval = 86400
sourcetype = github:copilot:billing:ai_credit
index = default
python.version = python3
python.required = 3.9
disabled = true
