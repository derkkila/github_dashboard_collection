[extractIssueID]
REGEX = \"(message|body)\"\:\"[^\"]*(?:[Cc]los(?:e[sd]?|ing)|[Ff]ix(?:e[sd]|ing)?|[Rr]esolv(?:e[sd]?|ing)?|[Ww]ork\s(?:[Ff]or|[Oo]n)?)\s(?:[A-Za-z\#\/_-]*)(?<issueNumber>[0-9]+)[^\"]*\"
MV_ADD = true

[action]
DELIMS = .
FIELDS = change_type,command
SOURCE_KEY = action


[issueNumber]
MV_ADD = 1
REGEX = (?<issueNumber>(?<=refs\/heads\/|\"ref\":\")[\d]*)

[last_access_by_user]
filename = last_access_by_user.csv

[github_copilot_time_period]
# Flattens the enriched "time_period" object emitted by the
# github_copilot_billing modular input into top-level year / month / day
# fields so AI credit usage can be grouped by period in SPL.
REGEX = "time_period":\{"year":(?<year>\d+),"month":(?<month>\d+),"day":(?<day>\d+)\}
