name: Workflow Dispatcher

on:
  workflow_run:
    workflows: ["*"]
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.workflow_run.name != 'Workflow Dispatcher'
      && github.event.workflow_run.name != 'Send Workflow Telemetry to Splunk' }}
    steps:
      - name: Dispatch Send Workflow Telemetry to Splunk
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'send_telemetry_to_splunk.yml',
              ref: context.ref,
              inputs: {
                run_id: '${{ github.event.workflow_run.id }}',
                workflow_name: '${{ github.event.workflow_run.name }}'
              }
            });
