name: Send Workflow Trace to Splunk Observability

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'GitHub Actions workflow run ID to trace'
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  ExportTrace:
    runs-on: ubuntu-latest
    steps:
      - name: Export workflow run to Splunk Observability Cloud
        uses: corentinmusard/otel-cicd-action@v2
        with:
          otlpEndpoint: https://ingest.${{ secrets.SFX_REALM }}.signalfx.com/v2/trace/otlp
          otlpHeaders: "X-SF-Token=${{ secrets.SPLUNK_ACCESS_TOKEN }}"
          otelServiceName: github_dashboard_collection
          extraAttributes: "deployment.environment=github-actions"
          githubToken: ${{ github.token }}
          runId: ${{ inputs.run_id }}
